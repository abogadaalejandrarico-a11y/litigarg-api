<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>LitigARG</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#050816;
  color:#F9FAFB;
  height:100vh;
  overflow:hidden;
}

/* LOGIN */

.login-screen{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0A0A0A;
}

.login-box{
  width:380px;
  background:#111111;
  padding:40px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 0 40px rgba(0,0,0,0.75);
}

.login-box h1{
  font-size:32px;
  margin-bottom:10px;
  color:#ffffff;
}

.login-box p{
  color:#9CA3AF;
  margin-bottom:30px;
}

.login-box input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border:none;
  border-radius:12px;
  background:#151515;
  border:1px solid rgba(255,255,255,0.04);
  color:white;
  font-size:15px;
}

.login-box button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#B30000;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

.login-box button:hover{
  background:#D10000;
}

/* APP */

.app{
  display:none;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  background:#111111;
  border-right:1px solid rgba(255,255,255,0.05);
  display:flex;
  flex-direction:column;
}

.logo{
  padding:30px 25px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo-img{
  width:100%;
  max-width:220px;
  object-fit:contain;
}

.login-logo{
  width:100%;
  max-width:260px;
  margin:0 auto 25px auto;
  display:block;
  object-fit:contain;
}

.logo h1{
  color:#ffffff;
  font-size:28px;
  margin-bottom:5px;
}

.logo span{
  color:#9CA3AF;
  font-size:14px;
}

.new-chat{
  margin:20px 20px 10px 20px;
  padding:14px;
  background:#B30000;
  border:none;
  border-radius:12px;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.premium-button{
  margin:0 20px 20px 20px;
  padding:14px;
  background:#F5C542;
  border:none;
  border-radius:12px;
  color:#111111;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
}

.premium-button:hover{
  background:#FFD966;
}

.premium-button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.chats{
  padding:10px;
  overflow-y:auto;
}

.chat-item{
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  color:#D1D5DB;
  margin-bottom:8px;
  transition:0.2s;
}

.chat-item:hover{
  background:#121826;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  background:#0A0A0A;
}

/* HEADER */

.header{
  padding:25px 40px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.header h2{
  font-size:24px;
}

.header p{
  color:#9CA3AF;
  margin-top:5px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:40px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* MESSAGE */

.message{
  max-width:75%;
  padding:18px;
  border-radius:18px;
  line-height:1.7;
  font-size:15px;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;
  background:#B30000;
}

.bot{
  align-self:flex-start;
  background:#1A1A1A;
}

/* INPUT */

.input-container{
  padding:25px;
  border-top:1px solid rgba(255,255,255,0.05);
  background:#111111;
}

.input-box{
  display:flex;
  gap:15px;
}

.input-box input{
  flex:1;
  padding:18px;
  border:none;
  border-radius:14px;
  background:#1A1A1A;
  color:white;
  font-size:15px;
}

.input-box button{
  width:140px;
  border:none;
  border-radius:14px;
  background:#B30000;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

.input-box button:hover{
  background:#D10000;
}

/* SCROLL */

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:#374151;
  border-radius:20px;
}

.typing{
  align-self:flex-start;
  background:#151515;
  padding:18px 22px;
  border-radius:18px;
  color:#9CA3AF;
  font-style:italic;
  animation:pulse 1s infinite;
}

@keyframes pulse{

  0%{
    opacity:0.4;
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:0.4;
  }

}

.welcome{
  margin:auto;
  text-align:center;
  max-width:900px;
}

.welcome h1{
  font-size:48px;
  margin-bottom:15px;
  font-weight:700;
}

.welcome p{
  color:#9CA3AF;
  margin-bottom:45px;
  font-size:18px;
}

.welcome-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.welcome-card{
  background:#151515;
  padding:28px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.05);
  transition:0.25s;
  cursor:pointer;
  font-size:17px;
}

.welcome-card:hover{
  border-color:#B30000;
  transform:translateY(-3px);
  background:#1A1A1A;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

  <div class="login-box">

  <img
  src="logoblanco.png"
  alt="LitigARG"
  class="login-logo"
>

<p>Inteligencia Artificial para litigación penal.</p>

   <input
  type="email"
  id="email"
  placeholder="Correo"
>

<input
  type="password"
  id="password"
  placeholder="Contraseña"
  onkeypress="handleLoginEnter(event)"
>
    <button onclick="login()">Ingresar</button>

  </div>

</div>

<!-- APP -->

<div class="app" id="app">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="logo">

  <img
    src="logo.png"
    alt="LitigARG"
    class="logo-img"
  >

</div>

    <button class="new-chat">
      + Nuevo chat
    </button>

    <button class="premium-button" id="premiumButton" onclick="activatePremium()">
      Activar Premium
    </button>

    <div class="chats" id="chatList"></div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <div class="header">
      <h2>Asistente de litigación penal</h2>
      <p>Estrategia, argumentación y técnica de litigación penal.</p>
    </div>

    <div class="messages" id="messages">

  <div class="welcome" id="welcome">

    <h1>¿Cómo puedo ayudarte hoy?</h1>

    <p>
      LitigARG puede ayudarte en:
    </p>

    <div class="welcome-grid">

      <div
  	class="welcome-card"
  	onclick="setPrompt('Prepara un argumento jurídico utilizando las técnicas de hipnosis conversacional y de LitigARG, acerca de ')"
      >
  	Preparar un argumento jurídico
      </div>

      <div
  	class="welcome-card"
  	onclick="setPrompt('Analiza los siguientes elementos y realiza un interrogatorio y contrainterrogatorio estratégico para la defensa de ')"
      >
  	Interrogatorio y contrainterrogatorio
      </div>

      <div
  	class="welcome-card"
  	onclick="setPrompt('Realiza un estudio detallado del siguiente caso penal ')"
      >
  	Estudio de caso
      </div>

      <div
  	class="welcome-card"
  	onclick="setPrompt('Analiza los siguientes elementos materiales probatorios y haz un resumen de la información, identifica puntos críticos para la defensa y realiza estrategias defensivas ')"
      >
  	Análisis de EMP
      </div>

    </div>

  </div>

</div>

    <div class="input-container">

      <div class="input-box">

        <input
          type="text"
          id="msgInput"
          placeholder="Escribe LitigARG en que puede ayudarte..."
	  onkeypress="handleChatEnter(event)"
        >

        <button onclick="sendMessage()">
          Enviar
        </button>

      </div>

    </div>

  </div>

</div>

<script>

let token = "";

const API_URL = "https://litigarg-api.onrender.com";

let conversations = [];

let currentConversation = null;

function handleLoginEnter(event){

  if(event.key === "Enter"){

    login();

  }

}

function handleChatEnter(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}

function setPrompt(text){

  const input = document.getElementById("msgInput");

  input.value = text;

  input.focus();

}

function getCurrentUser(){

  if(!token) return null;

  try{

    const payload = token.split(".")[1];
    const decoded = JSON.parse(atob(payload));

    return decoded;

  }catch(error){

    console.error(error);
    return null;

  }

}

async function activatePremium(){

  const user = getCurrentUser();
  const button = document.getElementById("premiumButton");

  if(!user?.userId){

    alert("Primero inicia sesión para activar Premium.");
    return;

  }

  button.disabled = true;
  button.innerText = "Preparando pago...";

  try{

    const res = await fetch(
      API_URL + "/api/payments/create",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          userId:user.userId,
          plan:"premium_mensual"
        })
      }
    );

    const data = await res.json();

    if(data.init_point){

      window.location.href = data.init_point;
      return;

    }

    alert(data.error || "No se pudo crear el pago.");

  }catch(error){

    console.error(error);
    alert("Error conectando con Mercado Pago.");

  }finally{

    button.disabled = false;
    button.innerText = "Activar Premium";

  }

}

function createConversation(firstMessage){

  const id = Date.now();

  const title =
    firstMessage.substring(0,30) + "...";

  const conversation = {
    id,
    title,
    messages:[]
  };

  conversations.unshift(conversation);

  currentConversation = conversation;

  renderConversations();

}

function renderConversations(){

  const chatList =
    document.getElementById("chatList");

  chatList.innerHTML = "";

  conversations.forEach(conv => {

    const div =
      document.createElement("div");

    div.className = "chat-item";

    div.innerText = conv.title;

    div.onclick = () => {

      currentConversation = conv;

      loadConversation();

    };

    chatList.appendChild(div);

  });

}

function loadConversation(){

  const messages =
    document.getElementById("messages");

  messages.innerHTML = "";

  currentConversation.messages.forEach(msg => {

    addMessage(
      msg.text,
      msg.type
    );

  });

}

// LOGIN

async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{

    const res = await fetch(
      API_URL + "/api/auth/login",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await res.json();

    if(data.token){

      token = data.token;

      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "flex";

    }else{

      alert(data.error || "Error login");

    }

  }catch(error){

    console.error(error);
    alert("Error de conexión");

  }

}

// SEND MESSAGE

async function sendMessage(){

  const input = document.getElementById("msgInput");

  const text = input.value.trim();

  if(!text) return;

if(!currentConversation){

  createConversation(text);

}

  addMessage(text,"user");

currentConversation.messages.push({
  text,
  type:"user"
});

  input.value = "";

  const typing = document.createElement("div");

  typing.className = "typing";

  typing.id = "typing";

  typing.innerText = "LitigARG está analizando...";

  document
    .getElementById("messages")
    .appendChild(typing);

  typing.scrollIntoView({
    behavior:"smooth"
});

  try{

    const res = await fetch(
      API_URL + "/api/gpt/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
          message:text
        })
      }
    );

    const data = await res.json();

document.getElementById("typing")?.remove();

if(res.status === 403){

  const premiumMessage = data.error || "Necesitas activar Premium para usar esta función.";

  typeMessage(premiumMessage + "\n\nUsa el botón Activar Premium en la barra izquierda para continuar.");

  currentConversation.messages.push({
    text:premiumMessage,
    type:"bot"
  });

  return;

}

typeMessage(data.answer || data.error || "Error");

currentConversation.messages.push({
  text:data.answer || data.error || "Error",
  type:"bot"
});

  }catch(error){

    console.error(error);

    document.getElementById("typing")?.remove();

    addMessage(
      "Error de conexión con LitigARG",
      "bot"
    );

  }

}

// ADD MESSAGE

function addMessage(text,type){

  const welcome = document.getElementById("welcome");

  if(welcome){

    welcome.style.display = "none";

  }  
  
  const div = document.createElement("div");

  div.className = "message " + type;

  div.innerText = text;

  document
    .getElementById("messages")
    .appendChild(div);

  div.scrollIntoView({
    behavior:"smooth"
  });

}

async function typeMessage(text){

  const div = document.createElement("div");

  div.className = "message bot";

  document
    .getElementById("messages")
    .appendChild(div);

  let i = 0;

  const speed = 8;

  function type(){

    if(i < text.length){

      div.innerText += text.charAt(i);

      i++;

      div.scrollIntoView({
        behavior:"smooth"
      });

      setTimeout(type,speed);

    }

  }

  type();

}

</script>

</body>
</html>
